spring.application.name=maferrermartin

# H2 in memory, initialized with the sample data at startup
spring.datasource.url=jdbc:h2:mem:pricingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the schema from the entities; data.sql is then executed
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Detects the language via Accept-Language; if there is no header, Spanish is the default
spring.web.locale=es

# Actuator in port 8081 to avoid exposure to the outside
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
