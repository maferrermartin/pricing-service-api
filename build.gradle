plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '2.1.1')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

dependencies {
	// Web: expone el endpoint REST (Jackson + Tomcat embebido incluidos)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Persistencia: adaptador de salida del puerto de repositorio (Hibernate + HikariCP)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Validación de los parámetros de entrada del endpoint (Bean Validation)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Soporte de arquitectura modulith: verifica los límites entre módulos
	implementation 'org.springframework.modulith:spring-modulith-starter-core'

	// Base de datos en memoria pedida en el enunciado
	runtimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
