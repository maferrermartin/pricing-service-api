plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '2.1.1')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

dependencies {
	// Web: exposes the REST endpoint (including embedded Jackson + Tomcat)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Persistence: repository port output adapter (Hibernate + HikariCP)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Endpoint input parameter validation (Bean Validation)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Modulith architecture support: checks boundaries between modules
	implementation 'org.springframework.modulith:spring-modulith-starter-core'

	// In-memory database
	runtimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}
