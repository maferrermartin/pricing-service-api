name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Defense in case the executable bit is lost again in a commit from Windows
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
